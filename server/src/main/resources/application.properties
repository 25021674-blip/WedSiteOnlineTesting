spring.application.name=WedSiteOnlineTesting
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/online_testing?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Phần này là cấu hình lưu file PDF
app.storage.essay-path=storage/essay-submissions
app.storage.assignment-path=storage/essay-assignments
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Kiểm tra các lượt trắc nghiệm đã hết thời gian mỗi 10 giây.
app.exam.auto-submit-delay-ms=1000
