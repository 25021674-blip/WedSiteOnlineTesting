<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tùy chỉnh bài kiểm tra</title>
</head>
<body>
    <main>
        <form id="exam-configuration-form">
            <fieldset>
                <legend>Tùy chỉnh</legend>

                <div>
                    <input id="show-correct-answers-after-submit" name="showCorrectAnswersAfterSubmit" type="checkbox">
                    <label for="show-correct-answers-after-submit">Hiển thị đáp án sau khi nộp</label>
                </div>

                <div>
                    <input id="allow-retake" name="allowRetake" type="checkbox">
                    <label for="allow-retake">Cho phép làm lại</label>
                </div>

                <div>
                    <input id="time-limit-enabled" name="timeLimitEnabled" type="checkbox">
                    <label for="time-limit-enabled">Giới hạn thời gian</label>
                </div>

                <div>
                    <input id="show-score-after-submit" name="showScoreAfterSubmit" type="checkbox">
                    <label for="show-score-after-submit">Hiển thị điểm sau khi làm bài</label>
                </div>

                <div>
                    <input id="require-fullscreen" name="requireFullscreen" type="checkbox">
                    <label for="require-fullscreen">Toàn màn hình</label>
                </div>

                <div>
                    <input id="track-tab-switches" name="trackTabSwitches" type="checkbox">
                    <label for="track-tab-switches">Ghi lại số lần chuyển tab</label>
                </div>
            </fieldset>
        </form>
    </main>
</body>
</html>
